<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="8개 자료를 히트맵·점묘도·단계구분도로 살펴보고 순찰차 10대를 배치하는 지도 탐구"><title>새봄시 순찰 실험실</title><link rel="stylesheet" href="product.css"></head>
<body>
<a class="skip-link" href="#city-map">지도로 건너뛰기</a>
<header class="app-header"><a href="#" class="brand" aria-label="새봄시 순찰 실험실"><strong>새봄시</strong><span class="brand-divider">/</span><span>순찰 실험실</span></a><div class="header-actions"><span id="save-status" role="status">이 브라우저에 저장됨</span><button id="help" class="quiet">사용 안내</button><button id="export" class="outline">탐구 기록 ↗</button></div></header>
<nav class="step-nav" aria-label="탐구 단계"><button data-step="1"><i>1</i><span>관찰하기</span></button><button data-step="2"><i>2</i><span>10대 배치하기</span></button><button data-step="3"><i>3</i><span>결과 보고 고치기</span></button></nav>
<main class="workspace">
<aside class="layers-panel" aria-labelledby="layers-title"><div class="panel-head"><h2 id="layers-title">살펴볼 자료 <span id="layer-count">1 / 8</span></h2></div><div class="layer-tools"><button data-action="all-layers">모두 켜기</button><button data-action="no-layers">모두 끄기</button></div><div id="layer-list"></div><p class="layer-foot">체크하면 겹쳐요.<br>이름을 눌러 설정해요.</p></aside>
<section class="map-panel" aria-label="새봄시 지도">
<div class="map-top"><div id="focused-layer" class="focused-layer"></div><div class="map-modes" aria-label="지도 표현 방식"><button data-map-mode="heat">히트맵</button><button data-map-mode="dots">점묘도</button><button data-map-mode="area">단계구분도</button></div><div class="map-actions"><label class="place-select"><span class="sr-only">동네 찾아가기</span><select id="place-search"><option value="">동네 찾아가기</option></select></label><button id="map-expand" aria-expanded="false" aria-controls="activity-panel">근거 노트</button></div></div>
<div class="map-canvas">
<div id="map-container"><svg id="city-map" xmlns="http://www.w3.org/2000/svg" role="img" tabindex="0" aria-label="새봄시 지점별 자료 지도. 지점을 누르거나 화살표 키로 200m씩 옮겨 수치를 확인하세요."><defs><clipPath id="land-mask" clipPathUnits="userSpaceOnUse"></clipPath><pattern id="missing-pattern" width="35" height="35" patternUnits="userSpaceOnUse"><rect width="35" height="35" fill="#e0e2e4"/><path d="M0 35L35 0" stroke="#b5bbc0" stroke-width="8"/></pattern><pattern id="water-pattern" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M4 16h9m7 0h4" stroke="#fff" stroke-width="1.8" opacity=".24"/></pattern></defs><g id="map-world"><g id="terrain"></g><g id="roads"></g><g id="buildings"></g><g id="landmarks"></g><g id="data-layer"></g><g id="map-labels"></g><g id="selection-layer"></g><g id="route-layer"></g><g id="cars-layer"></g></g></svg></div>
<div class="map-tools"><button id="zoom-in" aria-label="지도 확대">＋</button><button id="zoom-out" aria-label="지도 축소">−</button><button id="reset-view" aria-label="지도 전체 보기">전체</button></div><div class="map-scale"><div id="scale-line"></div><span id="scale-label">500 m</span></div>
<div id="map-hover" class="map-hover" hidden></div><div id="point-card" class="point-card" aria-live="polite"></div>
</div>
<div class="map-legend"><div id="legend"></div><button id="legend-toggle" aria-haspopup="dialog" aria-label="지도 읽는 법">ⓘ</button><div id="reference-note"></div></div>
<div class="map-bottom"><p id="map-notice" role="status"></p><div id="explore-actions"><button class="outline" data-action="keep">이 지점을 근거로 담기</button><button class="primary" data-action="to-plan">10대 배치하기 →</button></div></div>
</section>
<aside id="activity-panel" class="activity-panel" aria-labelledby="activity-title"><button id="close-activity" class="panel-close" aria-label="활동 패널 닫기">×</button><div id="activity"></div></aside>
</main>
<footer class="app-footer"><span>수업용 가상 도시 · 8개 동네 · 순찰차 10대</span><button data-action="model-info">자료와 도착시간의 기준</button></footer>
<div id="toast" class="toast" role="status" hidden></div><div id="busy" class="busy" role="status" hidden><div><span class="spinner"></span><strong>같은 요청으로 배치를 실험하고 있어요</strong><p>길과 차량의 업무 상태를 계산합니다.</p></div></div>
<dialog id="dialog" aria-labelledby="dialog-title"><div class="dialog-head"><h2 id="dialog-title"></h2><button id="dialog-close" aria-label="창 닫기">×</button></div><div id="dialog-content"></div></dialog>
<script src="data.js"></script><script src="engine.js"></script><script src="gis.js"></script><script src="student-model.js"></script><script src="student-layers.js"></script><script src="student-presentation.js"></script><script src="student-map.js"></script><script src="app.js"></script>
</body></html>
